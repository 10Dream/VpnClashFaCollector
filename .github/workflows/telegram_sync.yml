name: Auto Proxy Update, Test and Convert

on:
  schedule:
    - cron: '0 * * * *'   # هر ۱ ساعت یک‌بار (اسکرپ و استخراج مداوم، تست کامل روزانه ساعت 03:00 UTC)
  workflow_dispatch:
    inputs:
      run_scraper:
        description: 'Run Telegram Scraper?'
        required: true
        type: boolean
        default: true
      run_extractor:
        description: 'Run Config Extractor?'
        required: true
        type: boolean
        default: true
      run_tester:
        description: 'Run Full Tester (Ping, Speed to 300, Gemini)?'
        required: true
        type: boolean
        default: true
      run_generator:
        description: 'Run Sub Generator?'
        required: true
        type: boolean
        default: true
      run_web:
        description: 'Run Web Panel Generator?'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml lxml

      - name: Check Schedule Mode (Hourly vs Daily Test)
        id: check_mode
        run: |
          UTC_HOUR=$(date -u +%H)
          echo "Current UTC Hour: $UTC_HOUR"
          if [ "$UTC_HOUR" = "03" ] || [ "${{ github.event.inputs.run_tester }}" = "true" ]; then
            echo "run_daily_test=true" >> "$GITHUB_OUTPUT"
            echo "Mode: Daily Testing Active (Ping + Speed 300 + Gemini)"
          else
            echo "run_daily_test=false" >> "$GITHUB_OUTPUT"
            echo "Mode: Hourly Scrape & Extract"
          fi

      - name: 1. Run Telegram Scraper
        if: github.event_name == 'schedule' || inputs.run_scraper == true
        run: python src/telegram_scraper.py

      - name: 2. Run Config Extractor
        if: github.event_name == 'schedule' || inputs.run_extractor == true
        run: python src/config_extractor.py

      - name: 3. Run Full Config Tester (Ping, Speed to 300, Gemini)
        if: (github.event_name == 'schedule' && steps.check_mode.outputs.run_daily_test == 'true') || (github.event_name == 'workflow_dispatch' && inputs.run_tester == true)
        run: python src/config_tester.py

      - name: 4. Run Sub Generator
        if: (github.event_name == 'schedule' && steps.check_mode.outputs.run_daily_test == 'true') || (github.event_name == 'workflow_dispatch' && inputs.run_generator == true)
        run: python src/sub_generator.py

      - name: 5. Run Web Panel Generator
        if: github.event_name == 'schedule' || inputs.run_web == true
        run: python src/web_generator.py

      - name: 6. Fast Static Page Setup
        run: |
          touch .nojekyll

      - name: Sync and Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Proxies & Web Panel [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          file_pattern: 'sub/** index.html src/telegram/** .nojekyll'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          push_options: '--force'

